<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><title>Forms</title></head>
<body>
<!-- Registers the "ify-lead" form with Netlify Forms. Leads captured by Ify, the call-me button,
     the AI visibility check and the demo form are filed here by netlify/lib/leads.mjs so the
     team gets an email notification. Visitors never see or fill this form. -->
<form name="ify-lead" method="POST" data-netlify="true" hidden>
<input type="hidden" name="form-name" value="ify-lead">
<input name="type"><input name="name"><input name="email" type="email"><input name="phone">
<input name="business"><input name="interest"><textarea name="details"></textarea>
</form>
</body>
</html>
